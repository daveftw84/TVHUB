name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unpack project if it was uploaded as a zip
        run: |
          if [ -f tvhub-scaffold.zip ]; then unzip -q -o tvhub-scaffold.zip; fi

      - name: Build debug APK
        run: |
          if [ -d tvapp ]; then cd tvapp; fi
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tvhub-debug-apk
          path: "**/app-debug.apk"
